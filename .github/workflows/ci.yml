name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Check, Test, and Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22"
          cache: true
          run-install: false

      - name: Install npm dependencies
        run: npm ci

      - name: Run typecheck, lint, and format checks
        run: vp run check

      - name: Run unit tests
        run: vp test --run

      - name: Build web bundle
        run: vp build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls -1d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: vaunch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
